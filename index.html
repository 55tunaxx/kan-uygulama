<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="/kan-uygulama/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="KAN MARKET – işletme, banka, kart, çek-senet ve borç-alacak takibi.">
  <meta name="theme-color" content="#0B1220">

  <!-- iPhone: Ana Ekrana Ekle ile tam ekran uygulama -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KAN MARKET">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KAN MARKET</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #0B1220; height: 100%; }
    #yukleniyor { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      color: #94A3B8; font: 500 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .3px; }
    #yukleniyor img { width: 150px; height: 150px; border-radius: 50%; box-shadow: 0 0 48px rgba(220, 38, 38, .35); }
    #yukleniyor b { color: #fff; font-size: 20px; letter-spacing: 2px; font-weight: 800; }
  </style>
</head>
<body>
  <div id="yukleniyor">
    <img src="icons/Icon-512.png" alt="KAN">
    <b>KAN MARKET</b>
    <span>Yükleniyor…</span>
  </div>
  <script>
    // Flutter ilk kareyi çizince açılış ekranını kaldır.
    window.addEventListener('flutter-first-frame', function () {
      var y = document.getElementById('yukleniyor');
      if (y) { y.style.transition = 'opacity .25s'; y.style.opacity = '0'; setTimeout(function () { y.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
